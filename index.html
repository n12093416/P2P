<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>무의미한 기록 웹사이트</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .counter {
      font-size: 3rem;
      font-weight: bold;
      color: #38bdf8;
      margin: 20px 0;
    }
    .status {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🤖 무의미한 기록 봇</h2>
    <div class="counter">222일째</div>
    <div class="status">
      아무 일도 일어나지 않고 있습니다.<br>
      <small>마지막 갱신: 2026년 08월 11일 20:58:48</small>
    </div>
  </div>
</body>
</html>
